name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 桌面工程默认选择 Windows 平台实现；Linux/macOS 上改 runs-on 并设置 CorkboardPlatform 也可构建。
    runs-on: windows-latest

    steps:
      # 版本号是构建期由 git 提供的（SecRandom.SimpleGitInfoGenerator 跑 git describe --tags）。
      # 浅克隆取不到 tag，取不到时 git 的报错文本会被当成标签写进 ProductVersion，
      # 所以这里必须全量拉取，和 Publish.yml 的 checkout 保持一致。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # 仓库内的 NuGet.config 只有公共源，因此这里是从 nuget.org / ClassIsland MyGet 冷还原；
      # 本机若想复用已有包缓存，把路径放进机器环境变量 NUGET_FALLBACK_PACKAGES（见 NuGet.config 注释）。
      - name: Restore
        run: dotnet restore Corkboard.sln

      - name: Build
        run: dotnet build Corkboard.sln -c Release --no-restore -v m

      - name: Test
        run: dotnet test Corkboard.Core.Tests\Corkboard.Core.Tests.csproj -c Release --no-build -v m
